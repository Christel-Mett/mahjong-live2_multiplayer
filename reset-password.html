<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort zurücksetzen - Mahjong-Treff</title>

    <style>
       body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('shared/hintergrund/mahjong2.1-treff.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        input[type="password"] {
            background: #1a252f;
            border: 1px solid #769091;
            padding: 14px;
            color: white;
            width: 90%;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
        }

        .reset-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
        }
        .reset-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(210, 180, 140, 0.3);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #d2b48c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    
<script src="https://cdn.jsdelivr.net/npm/i18next@23/dist/umd/i18next.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>      
    
</head>
<body>
    <div class="reset-container">
        <div class="reset-box">
            <h2>Neues Passwort</h2>
            <p style="font-size: 0.8em; opacity: 0.7;" data-i18n="reset.newPW">Gib dein neues Passwort ein.</p>
            <input type="password" id="newPass" placeholder="Neues Passwort" data-i18n-placeholder="reset.pwInput">
            <input type="password" id="newPassConfirm" placeholder="Passwort wiederholen" data-i18n-placeholder="reset.pwRepeat">
            <button onclick="submitNewPassword()" data-i18n="reset.pwSave">Speichern</button>
            <p id="msg" style="margin-top: 15px; font-size: 0.9em;"></p>
        </div>
    </div>

	 <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        function submitNewPassword() {
            const pass = document.getElementById('newPass').value;
            const passConf = document.getElementById('newPassConfirm').value;
            const msg = document.getElementById('msg');

            if (!token) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Ungültiger Sitzungs-Token.";
                msg.innerText = i18next.t('reset.invalidToken');
                return;
            }
            if (pass.length < 6) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Passwort muss mind. 6 Zeichen haben.";
                msg.innerText = i18next.t('reset.pwTooShort');
                return;
            }
            if (pass !== passConf) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Passwörter nicht gleich!";
                msg.innerText = i18next.t('reset.pwMismatch');
                return;
            }

            msg.style.color = "white";
            msg.innerText = "Wird gespeichert...";
            msg.innerText = i18next.t('reset.saving');

            // Sendet Token und Passwort an das Event in der app.js
            socket.emit('reset_password_final', { token: token, newPassword: pass });
        }

        socket.on('reset_password_response', (data) => {
            if (data.success) {
                alert(i18next.t('reset.success'));
                window.location.href = "/";
            } else {
                const msg = document.getElementById('msg');
                msg.style.color = "#ff4d4d";
                msg.innerText = "Fehler: " + data.message;
                msg.innerText = i18next.t('reset.error', { message: data.message });
            }
        });
    </script>
    <script src="/i18n.js"></script>
</body>
</html>
